<!-- NAVTERA CHAT WIDGET — Wix HTML Embed içine yapıştırılacak kod -->
<div id="navtera-chat-root"></div>
<style>
  #navtera-chat-root * { box-sizing: border-box; font-family: 'Montserrat', Arial, sans-serif; }

  #navtera-bubble {
    position: fixed; bottom: 24px; right: 24px; z-index: 999999;
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, #F5D77F, #A87C2A);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 6px 20px rgba(11,19,37,0.45);
    transition: transform 0.2s ease;
  }
  #navtera-bubble:hover { transform: scale(1.07); }
  #navtera-bubble svg { width: 28px; height: 28px; }

  #navtera-panel {
    position: fixed; bottom: 96px; right: 24px; z-index: 999999;
    width: 340px; max-width: 90vw; height: 460px; max-height: 70vh;
    background: #0B1325; border: 1px solid #A87C2A;
    border-radius: 16px; overflow: hidden; display: none;
    flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #navtera-panel.open { display: flex; }

  #navtera-header {
    background: #0B1325; border-bottom: 1px solid rgba(168,124,42,0.4);
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  #navtera-header-title { color: #F5D77F; font-family: 'Cinzel', serif; font-size: 15px; letter-spacing: 1px; }
  #navtera-header-sub { color: #cfcfcf; font-size: 11px; margin-top: 2px; }
  #navtera-close { color: #F5D77F; cursor: pointer; font-size: 18px; line-height: 1; opacity: 0.8; }
  #navtera-close:hover { opacity: 1; }

  #navtera-messages {
    flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    background: #0e1830;
  }
  .navtera-msg { max-width: 82%; padding: 9px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.4; }
  .navtera-msg.bot { align-self: flex-start; background: rgba(168,124,42,0.18); color: #F7F6F2; border: 1px solid rgba(168,124,42,0.35); }
  .navtera-msg.user { align-self: flex-end; background: #A87C2A; color: #0B1325; font-weight: 500; }
  .navtera-msg.typing { align-self: flex-start; color: #cfcfcf; font-style: italic; font-size: 12.5px; }

  #navtera-inputbar {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(168,124,42,0.3); background: #0B1325;
  }
  #navtera-input {
    flex: 1; background: #14213D; border: 1px solid rgba(168,124,42,0.4); border-radius: 20px;
    padding: 9px 14px; color: #F7F6F2; font-size: 13px; outline: none;
  }
  #navtera-input::placeholder { color: #8f8f9a; }
  #navtera-send {
    background: #A87C2A; color: #0B1325; border: none; border-radius: 20px;
    padding: 0 16px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  #navtera-send:hover { background: #F5D77F; }

  @media (max-width: 480px) {
    #navtera-panel { right: 12px; bottom: 88px; width: calc(100vw - 24px); }
    #navtera-bubble { right: 12px; bottom: 16px; }
  }
</style>

<div id="navtera-bubble" onclick="navteraToggle()">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 4h16v12H7l-3 3V4z" stroke="#0B1325" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>
</div>

<div id="navtera-panel">
  <div id="navtera-header">
    <div>
      <div id="navtera-header-title">NAVTERA</div>
      <div id="navtera-header-sub">Size nasıl yardımcı olabiliriz?</div>
    </div>
    <div id="navtera-close" onclick="navteraToggle()">✕</div>
  </div>
  <div id="navtera-messages"></div>
  <div id="navtera-inputbar">
    <input id="navtera-input" type="text" placeholder="Mesajınızı yazın..." onkeydown="if(event.key==='Enter')navteraSend()" />
    <button id="navtera-send" onclick="navteraSend()">Gönder</button>
  </div>
</div>

<script>
  // Backend adresiniz — Render'daki canlı adresinizle güncelleyin
  const NAVTERA_API_URL = "https://navtera.onrender.com/api/chat";

  let navteraOpened = false;
  let navteraGreeted = false;

  function navteraToggle() {
    navteraOpened = !navteraOpened;
    document.getElementById('navtera-panel').classList.toggle('open', navteraOpened);
    if (navteraOpened && !navteraGreeted) {
      navteraAddMessage('bot', 'Merhaba! Ben Navtera asistanıyım. Size nasıl yardımcı olabilirim? İsim, telefon, liman ve tarih bilgilerinizi paylaşırsanız rezervasyon talebinizi hemen ekibimize iletebilirim.');
      navteraGreeted = true;
    }
  }

  function navteraAddMessage(role, text) {
    const box = document.getElementById('navtera-messages');
    const el = document.createElement('div');
    el.className = 'navtera-msg ' + role;
    el.textContent = text;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
    return el;
  }

  async function navteraSend() {
    const input = document.getElementById('navtera-input');
    const text = input.value.trim();
    if (!text) return;
    navteraAddMessage('user', text);
    input.value = '';

    const typingEl = navteraAddMessage('typing', 'Navtera yazıyor...');

    try {
      const res = await fetch(NAVTERA_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typingEl.remove();
      navteraAddMessage('bot', data.response || 'Şu an yanıt veremiyorum, lütfen tekrar deneyin.');
    } catch (err) {
      typingEl.remove();
      navteraAddMessage('bot', 'Bağlantı hatası oluştu, lütfen daha sonra tekrar deneyin.');
    }
  }
</script>
